plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Repositories used by a normal (internet-connected) build.
// ModDevGradle adds maven.neoforged.net itself; the extra mirrors are harmless.
repositories {
    mavenCentral()
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }
    maven { url = 'https://maven.createmod.net' }          // Create / Flywheel / Ponder
    maven { url = 'https://api.modrinth.com/maven' }       // Create Aeronautics runtime jar
    maven { url = 'https://maven.ryanhcode.dev/releases' } // Aeronautics / Sable / Simulated
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://libraries.minecraft.net' }
}

dependencies {
    // Create itself is only a *theme* dependency: no code here imports Create
    // classes. The one exception is Ponder (hold-W tutorials), which lives in
    // its own library and is compiled against at compileOnly scope.
    //
    // com.wanderingearth.compat.WanderingEarthPonder is the only class that
    // touches net.createmod.*; it is loaded reflectively and only when Create
    // is present, so a standalone install never links against it.
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        client { client() }
        server { server() }
        data { data() }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    // neoforge.mods.toml / pack.mcmeta are shipped as literal files,
    // so no property expansion is required.
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors,
            'Built-On-Minecraft'      : minecraft_version,
            'Built-On-NeoForge'       : neoforge_version
        ])
    }
}

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}
